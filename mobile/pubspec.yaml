name: legal_assist
description: "LegalAssist mobile companion for Malaysian civil litigation law firms."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Auth & backend
  supabase_flutter: ^2.9.1
  http: ^1.4.0

  # State management
  provider: ^6.1.5

  # UI helpers
  intl: ^0.20.2
  url_launcher: ^6.3.1
  table_calendar: ^3.1.3

  # OCR / camera
  google_mlkit_text_recognition: ^0.13.0
  image_picker: ^1.1.2

  # Document upload
  file_picker: ^8.1.0
  http_parser: ^4.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
