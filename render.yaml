services:
  # ── AI / NLP Service ────────────────────────────────────────────────────────
  - type: web
    name: legalassist-ai
    runtime: docker
    rootDir: ai-service
    dockerfilePath: ./Dockerfile
    plan: free

  # ── Backend API ─────────────────────────────────────────────────────────────
  - type: web
    name: legalassist-backend
    runtime: node
    rootDir: legal-system-backend
    buildCommand: npm install
    startCommand: npm start
    plan: free
    envVars:
      - key: NODE_VERSION
        value: "22.12.0"
      - key: NODE_ENV
        value: production
      # URL of the AI service above — deterministic from service name
      - key: AI_SERVICE_URL
        value: https://legalassist-ai.onrender.com
      # Set these in the Render dashboard (Dashboard → legalassist-backend → Environment)
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
